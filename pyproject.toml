[project]
name = "sitecheck"
version = "0.1.0"
description = "Passive website checker with static before/after HTML reports"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
sitecheck = "sitecheck.cli:main"

[tool.setuptools]
packages = ["sitecheck"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
